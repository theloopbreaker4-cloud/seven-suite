<div class="flex h-screen overflow-hidden bg-[--bg-primary]">

  <!-- Sidebar -->
  <aside [class]="sidebarOpen ? 'w-60 shrink-0 flex flex-col h-full transition-all duration-200' : 'w-0 overflow-hidden transition-all duration-200'">
    <app-admin-sidebar></app-admin-sidebar>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <app-admin-header (toggleSidebar)="toggleSidebar()"></app-admin-header>
    <main class="flex-1 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
