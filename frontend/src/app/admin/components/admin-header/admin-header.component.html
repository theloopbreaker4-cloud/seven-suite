<header class="h-14 border-b border-[--border-color] bg-[--bg-secondary]/80 backdrop-blur-md flex items-center px-4 gap-3 shrink-0">

  <!-- Sidebar toggle -->
  <button (click)="onToggleSidebar()"
          class="p-1.5 rounded-lg text-[--text-tertiary] hover:text-[--text-primary] hover:bg-[--bg-tertiary] transition-colors lg:hidden">
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <span class="flex-1"></span>

  <!-- Theme toggle -->
  <button (click)="toggleTheme()"
          class="p-1.5 rounded-lg text-[--text-tertiary] hover:text-[--text-primary] hover:bg-[--bg-tertiary] transition-colors"
          title="Toggle theme">
    <svg *ngIf="currentTheme === 'light'" class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
    </svg>
    <svg *ngIf="currentTheme === 'dark'" class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
    </svg>
  </button>

  <!-- User menu -->
  <div class="relative">
    <button (click)="menuOpen = !menuOpen"
            class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg hover:bg-[--bg-tertiary] transition-colors text-sm text-[--text-primary]">
      <span class="w-7 h-7 rounded-full bg-gradient-to-br from-[--primary] to-[--secondary] text-white flex items-center justify-center text-xs font-bold shrink-0">
        {{ (currentUser?.firstName?.[0] ?? '') }}{{ (currentUser?.lastName?.[0] ?? '') }}
      </span>
      <span class="hidden sm:inline text-sm font-medium max-w-[120px] truncate">{{ currentUser?.firstName }} {{ currentUser?.lastName }}</span>
      <svg class="w-3.5 h-3.5 text-[--text-tertiary]" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
      </svg>
    </button>

    <div *ngIf="menuOpen"
         class="absolute right-0 mt-1.5 w-52 bg-[--bg-secondary] border border-[--border-color] rounded-xl shadow-xl z-50 py-1.5 text-sm overflow-hidden">
      <button (click)="goToProfile(); menuOpen=false"
              class="w-full text-left flex items-center gap-2.5 px-4 py-2.5 hover:bg-[--bg-tertiary] text-[--text-primary] transition-colors">
        <svg class="w-4 h-4 text-[--text-tertiary]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0112 0v2"/></svg>
        Profile
      </button>
      <button (click)="goToSettings(); menuOpen=false"
              class="w-full text-left flex items-center gap-2.5 px-4 py-2.5 hover:bg-[--bg-tertiary] text-[--text-primary] transition-colors">
        <svg class="w-4 h-4 text-[--text-tertiary]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </button>
      <div class="h-px bg-[--border-color] my-1"></div>
      <button (click)="logout()"
              class="w-full text-left flex items-center gap-2.5 px-4 py-2.5 hover:bg-red-500/10 text-red-400 transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </div>
</header>
