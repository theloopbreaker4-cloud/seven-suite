<div class="p-6">
  <ng-container *ngIf="view === 'list'">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-semibold text-[--text-primary]">Menus</h1>
        <p class="text-sm text-[--text-secondary]">Manage navigation menus and their items</p>
      </div>
      <button (click)="openCreate()"
              class="flex items-center gap-2 px-4 py-2 rounded-lg bg-[--primary] text-white text-sm font-medium hover:bg-[--primary-hover] transition-colors">
        <mat-icon class="text-[18px] leading-none">add</mat-icon>
        New Menu
      </button>
    </div>

    <div *ngIf="error()" class="mb-4 px-4 py-3 rounded-lg bg-red-500/10 text-red-400 text-sm">{{ error() }}</div>

    <div class="rounded-xl border border-[--border-color] overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-[--bg-secondary]">
          <tr>
            <th class="px-4 py-3 text-left font-medium text-[--text-secondary]">Name</th>
            <th class="px-4 py-3 text-left font-medium text-[--text-secondary]">Handle</th>
            <th class="px-4 py-3 text-left font-medium text-[--text-secondary]">Items</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="loading()">
            <td colspan="4" class="px-4 py-8 text-center text-[--text-tertiary]">Loading…</td>
          </tr>
          <tr *ngIf="!loading() && menus().length === 0">
            <td colspan="4" class="px-4 py-8 text-center text-[--text-tertiary]">No menus yet</td>
          </tr>
          <tr *ngFor="let menu of menus()" class="border-t border-[--border-color] hover:bg-[--bg-secondary] transition-colors">
            <td class="px-4 py-3 text-[--text-primary]">{{ menu.name }}</td>
            <td class="px-4 py-3 font-mono text-xs text-[--text-tertiary]">{{ menu.handle }}</td>
            <td class="px-4 py-3 text-[--text-tertiary]">{{ menu.items?.length || 0 }}</td>
            <td class="px-4 py-3">
              <div class="flex items-center justify-end gap-1">
                <button (click)="openEdit(menu)" class="p-1.5 rounded-md text-[--text-tertiary] hover:text-[--text-primary] hover:bg-[--bg-tertiary] transition-colors">
                  <mat-icon class="text-[16px]">edit</mat-icon>
                </button>
                <button (click)="delete(menu)" class="p-1.5 rounded-md text-[--text-tertiary] hover:text-red-400 hover:bg-red-500/10 transition-colors">
                  <mat-icon class="text-[16px]">delete</mat-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </ng-container>

  <ng-container *ngIf="view === 'form'">
    <div class="flex items-center gap-3 mb-6">
      <button (click)="cancel()" class="p-1.5 rounded-md text-[--text-tertiary] hover:text-[--text-primary] hover:bg-[--bg-tertiary] transition-colors">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h1 class="text-xl font-semibold text-[--text-primary]">{{ editId ? 'Edit Menu' : 'New Menu' }}</h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-6 max-w-3xl">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-[--text-secondary] mb-1.5">Name</label>
          <input formControlName="name" type="text"
                 class="w-full px-3 py-2 rounded-lg border border-[--border-color] bg-[--bg-secondary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]" />
        </div>
        <div>
          <label class="block text-xs font-medium text-[--text-secondary] mb-1.5">Handle</label>
          <input formControlName="handle" type="text" placeholder="main-menu"
                 class="w-full px-3 py-2 rounded-lg border border-[--border-color] bg-[--bg-secondary] text-[--text-primary] text-sm font-mono focus:outline-none focus:border-[--primary]" />
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-3">
          <label class="text-sm font-medium text-[--text-primary]">Menu Items</label>
          <button type="button" (click)="addItem()"
                  class="flex items-center gap-1.5 px-3 py-1.5 rounded-md border border-[--border-color] text-xs font-medium text-[--text-primary] hover:bg-[--bg-tertiary] transition-colors">
            <mat-icon class="text-[14px] leading-none">add</mat-icon>
            Add Item
          </button>
        </div>

        <div formArrayName="items" class="space-y-3">
          <div *ngFor="let itemCtrl of items.controls; let i = index" [formGroupName]="i"
               class="grid grid-cols-[1fr_1fr_auto_auto_auto] gap-2 items-end p-3 rounded-lg border border-[--border-color] bg-[--bg-secondary]">
            <div>
              <label class="block text-[11px] text-[--text-tertiary] mb-1">Label</label>
              <input formControlName="label" type="text"
                     class="w-full px-2 py-1.5 rounded-md border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-xs focus:outline-none focus:border-[--primary]" />
            </div>
            <div>
              <label class="block text-[11px] text-[--text-tertiary] mb-1">URL</label>
              <input formControlName="url" type="text" placeholder="/about"
                     class="w-full px-2 py-1.5 rounded-md border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-xs font-mono focus:outline-none focus:border-[--primary]" />
            </div>
            <div>
              <label class="block text-[11px] text-[--text-tertiary] mb-1">Target</label>
              <select formControlName="target"
                      class="px-2 py-1.5 rounded-md border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-xs focus:outline-none focus:border-[--primary]">
                <option value="_self">_self</option>
                <option value="_blank">_blank</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] text-[--text-tertiary] mb-1">Sort</label>
              <input formControlName="sortOrder" type="number"
                     class="w-16 px-2 py-1.5 rounded-md border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-xs focus:outline-none focus:border-[--primary]" />
            </div>
            <button type="button" (click)="removeItem(i)"
                    class="p-1.5 rounded-md text-[--text-tertiary] hover:text-red-400 hover:bg-red-500/10 transition-colors">
              <mat-icon class="text-[16px]">delete</mat-icon>
            </button>
          </div>

          <div *ngIf="items.controls.length === 0" class="text-center py-6 rounded-lg border border-dashed border-[--border-color] text-sm text-[--text-tertiary]">
            No items — click "Add Item" to start
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2 pt-2">
        <button type="submit" [disabled]="saving() || form.invalid"
                class="px-4 py-2 rounded-lg bg-[--primary] text-white text-sm font-medium hover:bg-[--primary-hover] disabled:opacity-50 transition-colors">
          {{ saving() ? 'Saving…' : (editId ? 'Update' : 'Create') }}
        </button>
        <button type="button" (click)="cancel()"
                class="px-4 py-2 rounded-lg border border-[--border-color] text-[--text-primary] text-sm hover:bg-[--bg-tertiary] transition-colors">
          Cancel
        </button>
      </div>
    </form>
  </ng-container>
</div>
