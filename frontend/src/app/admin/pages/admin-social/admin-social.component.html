<div class="p-6">
  <ng-container *ngIf="view === 'list'">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-semibold text-[--text-primary]">Social Links</h1>
        <p class="text-sm text-[--text-secondary]">Manage social media links</p>
      </div>
      <button (click)="openCreate()"
              class="flex items-center gap-2 px-4 py-2 rounded-lg bg-[--primary] text-white text-sm font-medium hover:bg-[--primary-hover] transition-colors">
        <mat-icon class="text-[18px] leading-none">add</mat-icon>
        New Link
      </button>
    </div>

    <div *ngIf="error()" class="mb-4 px-4 py-3 rounded-lg bg-red-500/10 text-red-400 text-sm">{{ error() }}</div>

    <div class="rounded-xl border border-[--border-color] overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-[--bg-secondary]">
          <tr>
            <th class="px-4 py-3 text-left font-medium text-[--text-secondary]">Platform</th>
            <th class="px-4 py-3 text-left font-medium text-[--text-secondary]">Label</th>
            <th class="px-4 py-3 text-left font-medium text-[--text-secondary]">URL</th>
            <th class="px-4 py-3 text-center font-medium text-[--text-secondary]">Active</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="loading()"><td colspan="5" class="px-4 py-8 text-center text-[--text-tertiary]">Loading…</td></tr>
          <tr *ngIf="!loading() && links().length === 0"><td colspan="5" class="px-4 py-8 text-center text-[--text-tertiary]">No social links yet</td></tr>
          <tr *ngFor="let link of links()" class="border-t border-[--border-color] hover:bg-[--bg-secondary] transition-colors">
            <td class="px-4 py-3 font-medium capitalize text-[--text-primary]">{{ link.platform }}</td>
            <td class="px-4 py-3 text-[--text-secondary]">{{ link.label || '—' }}</td>
            <td class="px-4 py-3 font-mono text-xs text-[--text-tertiary] max-w-xs truncate">{{ link.url }}</td>
            <td class="px-4 py-3 text-center">
              <span [class]="link.isActive ? 'inline-flex px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/15 text-emerald-400' : 'inline-flex px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-500/15 text-[--text-tertiary]'">
                {{ link.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
            <td class="px-4 py-3">
              <div class="flex items-center justify-end gap-1">
                <button (click)="openEdit(link)" class="p-1.5 rounded-md text-[--text-tertiary] hover:text-[--text-primary] hover:bg-[--bg-tertiary] transition-colors">
                  <mat-icon class="text-[16px]">edit</mat-icon>
                </button>
                <button (click)="delete(link)" class="p-1.5 rounded-md text-[--text-tertiary] hover:text-red-400 hover:bg-red-500/10 transition-colors">
                  <mat-icon class="text-[16px]">delete</mat-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </ng-container>

  <ng-container *ngIf="view === 'form'">
    <div class="flex items-center gap-3 mb-6">
      <button (click)="cancel()" class="p-1.5 rounded-md text-[--text-tertiary] hover:text-[--text-primary] hover:bg-[--bg-tertiary] transition-colors">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h1 class="text-xl font-semibold text-[--text-primary]">{{ editId ? 'Edit Link' : 'New Social Link' }}</h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="max-w-md space-y-4">
      <div>
        <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">Platform</label>
        <select formControlName="platform"
                class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]">
          <option *ngFor="let p of platforms" [value]="p">{{ p }}</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">URL <span class="text-red-400">*</span></label>
        <input formControlName="url" placeholder="https://..." type="url"
               class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]" />
      </div>
      <div>
        <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">Label</label>
        <input formControlName="label" placeholder="Follow us on Twitter"
               class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]" />
      </div>
      <div>
        <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">Sort Order</label>
        <input formControlName="sortOrder" type="number" min="0"
               class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]" />
      </div>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" formControlName="isActive" class="w-4 h-4 accent-[--primary]" />
        <span class="text-sm text-[--text-secondary]">Active</span>
      </label>

      <div class="flex gap-3 pt-2">
        <button type="submit" [disabled]="saving()"
                class="px-5 py-2.5 rounded-lg bg-[--primary] text-white text-sm font-medium hover:bg-[--primary-hover] disabled:opacity-50 transition-colors">
          {{ saving() ? 'Saving…' : (editId ? 'Update' : 'Create') }}
        </button>
        <button type="button" (click)="cancel()"
                class="px-5 py-2.5 rounded-lg border border-[--border-color] text-[--text-secondary] text-sm font-medium hover:bg-[--bg-secondary] transition-colors">
          Cancel
        </button>
      </div>
    </form>
  </ng-container>
</div>
