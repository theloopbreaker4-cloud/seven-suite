<div class="p-6 space-y-6">

  <!-- Page header -->
  <div>
    <h1 class="text-xl font-semibold text-[--text-primary]">Dashboard</h1>
    <p class="text-sm text-[--text-secondary] mt-0.5">Welcome back — here's what's happening.</p>
  </div>

  <!-- Stats grid -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
    <div *ngFor="let s of stats()"
         class="p-5 rounded-2xl bg-[--bg-secondary] border border-[--border-color] hover:border-[--primary]/30 transition-colors">
      <div class="flex items-start justify-between mb-4">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" [style.background-color]="s.color + '22'">
          <mat-icon class="text-[18px] leading-none" [style.color]="s.color">{{ s.icon }}</mat-icon>
        </div>
      </div>
      <p class="text-2xl font-bold text-[--text-primary]">{{ s.value }}</p>
      <p class="text-xs text-[--text-secondary] mt-0.5">{{ s.title }}</p>
    </div>

    <div *ngIf="stats().length === 0 && loading()" class="col-span-full text-center py-8 text-[--text-tertiary] text-sm">
      Loading stats…
    </div>
  </div>

  <!-- Bottom grid -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

    <!-- Recent activity -->
    <div class="lg:col-span-2 rounded-2xl bg-[--bg-secondary] border border-[--border-color]">
      <div class="px-5 py-4 border-b border-[--border-color] flex items-center justify-between">
        <h2 class="font-semibold text-[--text-primary] text-sm">Recent Activity</h2>
        <span class="text-xs text-[--text-tertiary]">Last 24h</span>
      </div>
      <div class="divide-y divide-[--border-color]">
        <div *ngIf="recentActivities().length === 0" class="px-5 py-6 text-center text-sm text-[--text-tertiary]">
          No activity yet
        </div>
        <div *ngFor="let activity of recentActivities()" class="flex items-start gap-3 px-5 py-3.5 hover:bg-[--bg-tertiary]/50 transition-colors">
          <div class="w-8 h-8 rounded-full bg-[--primary]/10 flex items-center justify-center shrink-0 mt-0.5">
            <mat-icon class="text-[--primary] text-[14px] leading-none w-4 h-4">{{ activity.icon }}</mat-icon>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-[--text-primary] truncate">{{ activity.user }}</p>
            <p class="text-xs text-[--text-secondary]">{{ activity.action }}</p>
          </div>
          <span class="text-[11px] text-[--text-tertiary] shrink-0 pt-0.5">{{ activity.time }}</span>
        </div>
      </div>
    </div>

    <!-- Quick actions -->
    <div class="rounded-2xl bg-[--bg-secondary] border border-[--border-color]">
      <div class="px-5 py-4 border-b border-[--border-color]">
        <h2 class="font-semibold text-[--text-primary] text-sm">Quick Actions</h2>
      </div>
      <div class="p-4 space-y-2">
        <a routerLink="/admin/pages" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl bg-[--bg-tertiary] hover:bg-[--primary]/10 hover:text-[--primary] text-[--text-secondary] text-sm font-medium transition-all group">
          <svg class="w-4 h-4 group-hover:text-[--primary] transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          New Page
        </a>
        <a routerLink="/admin/blog" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl bg-[--bg-tertiary] hover:bg-[--primary]/10 hover:text-[--primary] text-[--text-secondary] text-sm font-medium transition-all group">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          New Post
        </a>
        <a routerLink="/admin/users" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl bg-[--bg-tertiary] hover:bg-[--primary]/10 hover:text-[--primary] text-[--text-secondary] text-sm font-medium transition-all group">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          Manage Users
        </a>
        <a routerLink="/admin/settings" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl bg-[--bg-tertiary] hover:bg-[--primary]/10 hover:text-[--primary] text-[--text-secondary] text-sm font-medium transition-all group">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          Settings
        </a>
      </div>
    </div>
  </div>
</div>
