<div class="p-6">
  <ng-container *ngIf="view === 'list'">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-semibold text-[--text-primary]">Categories</h1>
        <p class="text-sm text-[--text-secondary]">Manage content categories</p>
      </div>
      <button (click)="openCreate()"
              class="flex items-center gap-2 px-4 py-2 rounded-lg bg-[--primary] text-white text-sm font-medium hover:bg-[--primary-hover] transition-colors">
        <mat-icon class="text-[18px] leading-none">add</mat-icon>
        New Category
      </button>
    </div>

    <div *ngIf="error()" class="mb-4 px-4 py-3 rounded-lg bg-red-500/10 text-red-400 text-sm">{{ error() }}</div>

    <div class="rounded-xl border border-[--border-color] overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-[--bg-secondary]">
          <tr>
            <th class="px-4 py-3 text-left font-medium text-[--text-secondary]">Name (EN)</th>
            <th class="px-4 py-3 text-left font-medium text-[--text-secondary]">Slug</th>
            <th class="px-4 py-3 text-left font-medium text-[--text-secondary]">Type</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="loading()">
            <td colspan="4" class="px-4 py-8 text-center text-[--text-tertiary]">Loading…</td>
          </tr>
          <tr *ngIf="!loading() && categories().length === 0">
            <td colspan="4" class="px-4 py-8 text-center text-[--text-tertiary]">No categories yet</td>
          </tr>
          <tr *ngFor="let cat of categories()" class="border-t border-[--border-color] hover:bg-[--bg-secondary] transition-colors">
            <td class="px-4 py-3 text-[--text-primary]">{{ t(cat.name) }}</td>
            <td class="px-4 py-3 font-mono text-xs text-[--text-tertiary]">{{ cat.slug }}</td>
            <td class="px-4 py-3">
              <span class="px-2 py-0.5 rounded text-xs bg-[--bg-tertiary] text-[--text-tertiary]">{{ cat.type }}</span>
            </td>
            <td class="px-4 py-3">
              <div class="flex items-center justify-end gap-1">
                <button (click)="openEdit(cat)" class="p-1.5 rounded-md text-[--text-tertiary] hover:text-[--text-primary] hover:bg-[--bg-tertiary] transition-colors">
                  <mat-icon class="text-[16px]">edit</mat-icon>
                </button>
                <button (click)="delete(cat)" class="p-1.5 rounded-md text-[--text-tertiary] hover:text-red-400 hover:bg-red-500/10 transition-colors">
                  <mat-icon class="text-[16px]">delete</mat-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </ng-container>

  <ng-container *ngIf="view === 'form'">
    <div class="flex items-center gap-3 mb-6">
      <button (click)="cancel()" class="p-1.5 rounded-md text-[--text-tertiary] hover:text-[--text-primary] hover:bg-[--bg-tertiary] transition-colors">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h1 class="text-xl font-semibold text-[--text-primary]">{{ editId ? 'Edit Category' : 'New Category' }}</h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="max-w-2xl space-y-5">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">Slug <span class="text-red-400">*</span></label>
          <input formControlName="slug" placeholder="my-category"
                 class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm font-mono focus:outline-none focus:border-[--primary]" />
        </div>
        <div>
          <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">Type</label>
          <select formControlName="type"
                  class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]">
            <option value="post">post</option>
            <option value="page">page</option>
          </select>
        </div>
      </div>

      <div class="border-b border-[--border-color] flex gap-1">
        <button *ngFor="let lang of langs" type="button" (click)="activeLang = lang"
                [class]="activeLang === lang ? 'px-3 py-2 text-sm font-medium text-[--primary] border-b-2 border-[--primary] -mb-px' : 'px-3 py-2 text-sm text-[--text-tertiary] hover:text-[--text-primary]'">
          {{ lang.toUpperCase() }}
        </button>
      </div>

      <div formGroupName="name">
        <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">Name — {{ activeLang.toUpperCase() }}</label>
        <input [formControlName]="activeLang" class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]" />
      </div>

      <div formGroupName="description">
        <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">Description — {{ activeLang.toUpperCase() }}</label>
        <input [formControlName]="activeLang" class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]" />
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit" [disabled]="saving()"
                class="px-5 py-2.5 rounded-lg bg-[--primary] text-white text-sm font-medium hover:bg-[--primary-hover] disabled:opacity-50 transition-colors">
          {{ saving() ? 'Saving…' : (editId ? 'Update' : 'Create') }}
        </button>
        <button type="button" (click)="cancel()"
                class="px-5 py-2.5 rounded-lg border border-[--border-color] text-[--text-secondary] text-sm font-medium hover:bg-[--bg-secondary] transition-colors">
          Cancel
        </button>
      </div>
    </form>
  </ng-container>
</div>
