<div class="p-6">
  <ng-container *ngIf="view === 'list'">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-semibold text-[--text-primary]">Slider</h1>
        <p class="text-sm text-[--text-secondary]">Manage hero slides</p>
      </div>
      <button (click)="openCreate()"
              class="flex items-center gap-2 px-4 py-2 rounded-lg bg-[--primary] text-white text-sm font-medium hover:bg-[--primary-hover] transition-colors">
        <mat-icon class="text-[18px] leading-none">add</mat-icon>
        New Slide
      </button>
    </div>

    <div *ngIf="error()" class="mb-4 px-4 py-3 rounded-lg bg-red-500/10 text-red-400 text-sm">{{ error() }}</div>

    <div class="rounded-xl border border-[--border-color] overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-[--bg-secondary]">
          <tr>
            <th class="px-4 py-3 text-center font-medium text-[--text-secondary]">Order</th>
            <th class="px-4 py-3 text-left font-medium text-[--text-secondary]">Title (EN)</th>
            <th class="px-4 py-3 text-left font-medium text-[--text-secondary]">Image</th>
            <th class="px-4 py-3 text-center font-medium text-[--text-secondary]">Active</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="loading()"><td colspan="5" class="px-4 py-8 text-center text-[--text-tertiary]">Loading…</td></tr>
          <tr *ngIf="!loading() && slides().length === 0"><td colspan="5" class="px-4 py-8 text-center text-[--text-tertiary]">No slides yet</td></tr>
          <tr *ngFor="let slide of slides(); let i = index" class="border-t border-[--border-color] hover:bg-[--bg-secondary] transition-colors">
            <td class="px-4 py-3 text-center font-mono text-xs text-[--text-tertiary]">{{ slide.sortOrder }}</td>
            <td class="px-4 py-3 font-medium text-[--text-primary]">{{ t(slide.title) }}</td>
            <td class="px-4 py-3">
              <img *ngIf="slide.image" [src]="slide.image" class="w-16 h-10 object-cover rounded" />
              <span *ngIf="!slide.image" class="text-xs text-[--text-tertiary]">—</span>
            </td>
            <td class="px-4 py-3 text-center">
              <span [class]="slide.isActive ? 'inline-flex px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/15 text-emerald-400' : 'inline-flex px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-500/15 text-[--text-tertiary]'">
                {{ slide.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
            <td class="px-4 py-3">
              <div class="flex items-center justify-end gap-1">
                <button (click)="moveUp(slide)" [disabled]="i === 0" class="p-1 rounded text-[--text-tertiary] hover:text-[--text-primary] hover:bg-[--bg-tertiary] disabled:opacity-30 transition-colors">
                  <mat-icon class="text-[14px]">arrow_upward</mat-icon>
                </button>
                <button (click)="moveDown(slide)" [disabled]="i === slides().length - 1" class="p-1 rounded text-[--text-tertiary] hover:text-[--text-primary] hover:bg-[--bg-tertiary] disabled:opacity-30 transition-colors">
                  <mat-icon class="text-[14px]">arrow_downward</mat-icon>
                </button>
                <button (click)="openEdit(slide)" class="p-1.5 rounded-md text-[--text-tertiary] hover:text-[--text-primary] hover:bg-[--bg-tertiary] transition-colors">
                  <mat-icon class="text-[16px]">edit</mat-icon>
                </button>
                <button (click)="delete(slide)" class="p-1.5 rounded-md text-[--text-tertiary] hover:text-red-400 hover:bg-red-500/10 transition-colors">
                  <mat-icon class="text-[16px]">delete</mat-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </ng-container>

  <ng-container *ngIf="view === 'form'">
    <div class="flex items-center gap-3 mb-6">
      <button (click)="cancel()" class="p-1.5 rounded-md text-[--text-tertiary] hover:text-[--text-primary] hover:bg-[--bg-tertiary] transition-colors">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h1 class="text-xl font-semibold text-[--text-primary]">{{ editId ? 'Edit Slide' : 'New Slide' }}</h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="max-w-2xl space-y-5">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">Image URL</label>
          <input formControlName="image" placeholder="https://…"
                 class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]" />
        </div>
        <div>
          <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">Button URL</label>
          <input formControlName="buttonUrl" placeholder="https://…"
                 class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]" />
        </div>
        <div>
          <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">Overlay</label>
          <select formControlName="overlay"
                  class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]">
            <option value="none">None</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">Sort Order</label>
          <input formControlName="sortOrder" type="number" min="0"
                 class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]" />
        </div>
      </div>

      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" formControlName="isActive" class="w-4 h-4 accent-[--primary]" />
        <span class="text-sm text-[--text-secondary]">Active</span>
      </label>

      <div class="border-b border-[--border-color] flex gap-1">
        <button *ngFor="let lang of langs" type="button" (click)="activeLang = lang"
                [class]="activeLang === lang ? 'px-3 py-2 text-sm font-medium text-[--primary] border-b-2 border-[--primary] -mb-px' : 'px-3 py-2 text-sm text-[--text-tertiary] hover:text-[--text-primary]'">
          {{ lang.toUpperCase() }}
        </button>
      </div>

      <div formGroupName="title">
        <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">Title — {{ activeLang.toUpperCase() }}</label>
        <input [formControlName]="activeLang" class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]" />
      </div>
      <div formGroupName="subtitle">
        <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">Subtitle — {{ activeLang.toUpperCase() }}</label>
        <input [formControlName]="activeLang" class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]" />
      </div>
      <div formGroupName="buttonText">
        <label class="block text-sm font-medium text-[--text-secondary] mb-1.5">Button Text — {{ activeLang.toUpperCase() }}</label>
        <input [formControlName]="activeLang" class="w-full px-3 py-2.5 rounded-lg border border-[--border-color] bg-[--bg-primary] text-[--text-primary] text-sm focus:outline-none focus:border-[--primary]" />
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit" [disabled]="saving()"
                class="px-5 py-2.5 rounded-lg bg-[--primary] text-white text-sm font-medium hover:bg-[--primary-hover] disabled:opacity-50 transition-colors">
          {{ saving() ? 'Saving…' : (editId ? 'Update' : 'Create') }}
        </button>
        <button type="button" (click)="cancel()"
                class="px-5 py-2.5 rounded-lg border border-[--border-color] text-[--text-secondary] text-sm font-medium hover:bg-[--bg-secondary] transition-colors">
          Cancel
        </button>
      </div>
    </form>
  </ng-container>
</div>
