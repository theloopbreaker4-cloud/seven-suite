<app-site-layout>
  <section style="max-width: 40rem; margin: 0 auto; padding: 3rem 1rem;">
    <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
      <a routerLink="/dashboard"
         style="padding: 0.5rem; border-radius: 0.5rem; color: var(--text-tertiary); text-decoration: none; display: flex; align-items: center;">
        <mat-icon style="font-size: 20px; width: 20px; height: 20px;">arrow_back</mat-icon>
      </a>
      <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin: 0;">
        {{ tr('settings.title', 'Settings') }}
      </h1>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1rem;">
      <div style="border-radius: 1rem; border: 1px solid var(--border-color); background: var(--bg-secondary); padding: 1.25rem;">
        <h2 style="font-weight: 600; margin-bottom: 1rem; color: var(--text-primary);">
          {{ tr('settings.appearance', 'Appearance') }}
        </h2>
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 0.875rem; color: var(--text-secondary);">{{ tr('settings.theme', 'Theme') }}</span>
          <button (click)="theme.toggleTheme()"
                  style="padding: 0.375rem 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border-color); background: transparent; font-size: 0.875rem; color: var(--text-primary); cursor: pointer;">
            {{ theme.isDarkTheme() ? tr('settings.dark', 'Dark') : tr('settings.light', 'Light') }}
          </button>
        </div>
      </div>

      <div style="border-radius: 1rem; border: 1px solid var(--border-color); background: var(--bg-secondary); padding: 1.25rem;">
        <h2 style="font-weight: 600; margin-bottom: 1rem; color: var(--text-primary);">
          {{ tr('settings.language', 'Language') }}
        </h2>
        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
          <button *ngFor="let l of langs" (click)="setLang(l)"
                  [style.background]="l === i18n.lang() ? 'var(--primary)' : 'transparent'"
                  [style.color]="l === i18n.lang() ? '#fff' : 'var(--text-primary)'"
                  [style.border-color]="l === i18n.lang() ? 'var(--primary)' : 'var(--border-color)'"
                  style="padding: 0.375rem 0.75rem; border-radius: 0.5rem; border-style: solid; border-width: 1px; text-transform: uppercase; font-size: 0.75rem; font-weight: 600; cursor: pointer;">
            {{ l }}
          </button>
        </div>
      </div>
    </div>
  </section>
</app-site-layout>
