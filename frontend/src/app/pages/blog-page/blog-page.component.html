<app-site-layout>
  <section style="max-width: 72rem; margin: 0 auto; padding: 3rem 1rem;">
    <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 2rem; color: var(--text-primary);">
      {{ tr('nav.blog', 'Blog') }}
    </h1>

    <div *ngIf="loading()" style="text-align: center; padding: 3rem 0; color: var(--text-tertiary);">{{ tr('common.loading', 'Loading…') }}</div>

    <div *ngIf="!loading() && posts().length === 0"
         style="text-align: center; padding: 4rem 2rem; border-radius: 0.75rem; border: 1px dashed var(--border-color); color: var(--text-tertiary);">
      {{ tr('blog.empty', 'No posts yet') }}
    </div>

    <div *ngIf="posts().length > 0"
         style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;">
      <a *ngFor="let p of posts()" [routerLink]="['/blog', p.slug]"
         style="border-radius: 1rem; overflow: hidden; border: 1px solid var(--border-color); background: var(--bg-secondary); text-decoration: none; color: inherit; transition: border-color 0.2s;">
        <img *ngIf="p.coverImage" [src]="p.coverImage" [alt]="pick(p.title)" loading="lazy"
             style="width: 100%; height: 10rem; object-fit: cover; display: block;" />
        <div style="padding: 1rem;">
          <h2 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 0.25rem; color: var(--text-primary);">
            {{ pick(p.title) }}
          </h2>
          <p style="font-size: 0.875rem; color: var(--text-secondary); line-height: 1.5;">{{ pick(p.excerpt) || pick(p.content) }}</p>
          <p style="margin-top: 0.75rem; font-size: 0.75rem; color: var(--text-tertiary);">{{ formatDate(p.createdAt) }}</p>
        </div>
      </a>
    </div>
  </section>
</app-site-layout>
