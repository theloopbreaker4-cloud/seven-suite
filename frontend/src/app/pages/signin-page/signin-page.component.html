<app-site-layout>
  <section style="max-width: 28rem; margin: 0 auto; padding: 4rem 1rem;">
    <div style="border-radius: 1rem; border: 1px solid var(--border-color); background: var(--bg-secondary); padding: 2rem;">
      <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; color: var(--text-primary);">
        {{ tr('signin.title', 'Sign in') }}
      </h1>
      <p style="font-size: 0.875rem; margin-bottom: 1.5rem; color: var(--text-secondary);">
        {{ tr('signin.subtitle', 'Enter your credentials to continue') }}
      </p>

      <form [formGroup]="form" (ngSubmit)="submit()" style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
          <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.375rem; color: var(--text-secondary);">
            {{ tr('signin.email', 'Email') }}
          </label>
          <input formControlName="email" type="email" placeholder="you@example.com" autocomplete="email"
                 style="width: 100%; padding: 0.625rem 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); font-size: 0.875rem; box-sizing: border-box;" />
        </div>

        <div>
          <label style="display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.375rem; color: var(--text-secondary);">
            {{ tr('signin.password', 'Password') }}
          </label>
          <div style="position: relative;">
            <input formControlName="password" [type]="showPwd() ? 'text' : 'password'" autocomplete="current-password"
                   style="width: 100%; padding: 0.625rem 2.5rem 0.625rem 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); font-size: 0.875rem; box-sizing: border-box;" />
            <button type="button" (click)="showPwd.set(!showPwd())"
                    style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); padding: 0.25rem; background: transparent; border: none; cursor: pointer; color: var(--text-tertiary);">
              <mat-icon style="font-size: 18px; width: 18px; height: 18px; line-height: 1;">{{ showPwd() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-secondary);">
            <input formControlName="rememberMe" type="checkbox" style="accent-color: var(--primary);" />
            {{ tr('signin.remember', 'Remember me') }}
          </label>
          <a routerLink="/forgot-password" style="text-decoration: none; color: var(--primary);">
            {{ tr('signin.forgot', 'Forgot password?') }}
          </a>
        </div>

        <div *ngIf="error()" style="padding: 0.5rem 0.75rem; border-radius: 0.5rem; font-size: 0.75rem; background: rgba(239,68,68,0.1); color: #f87171;">
          {{ error() }}
        </div>

        <button type="submit" [disabled]="form.invalid || loading()"
                style="width: 100%; padding: 0.625rem; border-radius: 0.5rem; color: #fff; font-size: 0.875rem; font-weight: 500; background: var(--primary); border: none; cursor: pointer;"
                [style.opacity]="(form.invalid || loading()) ? '0.5' : '1'">
          {{ loading() ? tr('signin.signing', 'Signing in…') : tr('signin.submit', 'Sign in') }}
        </button>

        <p style="text-align: center; font-size: 0.75rem; padding-top: 0.5rem; color: var(--text-tertiary);">
          {{ tr('signin.noAccount', "Don't have an account?") }}
          <a routerLink="/signup" style="margin-left: 0.25rem; text-decoration: none; color: var(--primary);">
            {{ tr('nav.register', 'Sign up') }}
          </a>
        </p>
      </form>
    </div>
  </section>
</app-site-layout>
