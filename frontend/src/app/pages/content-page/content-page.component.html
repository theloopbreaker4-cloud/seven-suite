<app-site-layout>
  <article style="max-width: 48rem; margin: 0 auto; padding: 3rem 1rem;">
    <div *ngIf="loading()" style="text-align: center; padding: 4rem 0; color: var(--text-tertiary);">{{ tr('common.loading', 'Loading…') }}</div>
    <div *ngIf="!loading() && !page()" style="text-align: center; padding: 4rem 0; color: var(--text-tertiary);">
      {{ tr('page.notFound', 'Page not found') }}
    </div>

    <ng-container *ngIf="page() as p">
      <h1 style="font-size: 2.25rem; font-weight: 700; margin-bottom: 2rem; color: var(--text-primary); line-height: 1.2;">
        {{ pick(p.title) }}
      </h1>
      <div style="color: var(--text-secondary); line-height: 1.75; font-size: 1rem;" [innerHTML]="pick(p.content)"></div>
    </ng-container>
  </article>
</app-site-layout>
