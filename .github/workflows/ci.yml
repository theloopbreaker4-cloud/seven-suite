name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seven_suite_test
          POSTGRES_USER: seven
          POSTGRES_PASSWORD: seven_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seven" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://seven:seven_ci_password@localhost:5432/seven_suite_test
      DATABASE_TEST_URL: postgresql://seven:seven_ci_password@localhost:5432/seven_suite_test
      DATABASE_APP_URL: postgresql://seven_app:seven_app_ci_password@localhost:5432/seven_suite_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-ci-only-secret-1234
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - run: pnpm exec nx affected -t lint typecheck test build --parallel=3
      # Row-level security and other database invariants, on the real PostgreSQL service.
      - run: pnpm exec nx run server-platform:integration
      # Browser tests: the real API (built) and admin (dev server with the /api proxy) on the
      # database the integration step just migrated; email links are read from Mailpit.
      - name: Admin browser tests
        env:
          WEB_SERVICE_KEY: ci-only-web-service-key-ci-only-0001
          SMTP_URL: smtp://127.0.0.1:1025
          ADMIN_URL: http://127.0.0.1:4200
          PLATFORM_ADMINS: ops-e2e@e2e.seven
          WEB_BASE_DOMAIN: shops.local
          QUEUE_PREFIX: seven-e2e
          MAILPIT: http://127.0.0.1:8025
          LOG_LEVEL: warn
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec nx build api
          node dist/apps/api/main.js > /tmp/api.log 2>&1 &
          pnpm exec nx serve admin > /tmp/admin.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:4000/api/v1/health/ready > /dev/null && curl -sf http://127.0.0.1:4200/ > /dev/null && break
            sleep 2
          done
          mkdir -p /tmp/shots
          node e2e/admin/run-all.mjs /tmp/shots || { tail -40 /tmp/api.log; exit 1; }
          # Storefront: production build with the strict nonce CSP, resolving the e2e organization.
          pnpm exec nx build web
          (cd apps/web && WEB_DEV_HOST=ops-co.shops.local API_INTERNAL_URL=http://127.0.0.1:4000/api/v1 npx next start -p 4301 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4301/api/health > /dev/null && break; sleep 2; done
          WEB_BASE=http://127.0.0.1:4301 node e2e/web/storefront-e2e.mjs || { tail -40 /tmp/web.log; exit 1; }
      - name: Screenshots of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-screenshots
          path: /tmp/shots
          if-no-files-found: ignore

  # A clean checkout to a running stack: images built from source (frozen lockfile), migrations on
  # an empty database, then every service checked end to end — what a new installation goes through.
  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose -f docker/compose.yml up --build -d
      - name: Smoke test
        run: bash e2e/stack/stack-smoke.sh
      - name: Service logs
        if: failure()
        run: docker compose -f docker/compose.yml logs --tail=80
